services:
  postgres:
    image: postgres:16
    container_name: test_postgres
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  wiremock:
    image: wiremock/wiremock:latest
    container_name: test_wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock_data:/home/wiremock

  nats:
    image: nats:latest
    container_name: test_nats
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP management port (monitoring)


  redis:
    image: redis:7
    container_name: test_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: